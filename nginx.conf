server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Serve static files from the React build
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # For single page applications: redirect all requests to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend (Docker service name 'api_backend')
    # This prevents CORS issues and keeps frontend config simple (just hit /api)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
